# Raises CPU limits for the 7 services that now export OTLP traces (see
# otlp-env-patch.yaml). The original manifest's 200m CPU limit was sized
# for these services WITHOUT tracing overhead. Discovered during the M1A
# pilot run: currencyservice's gRPC health probe (readiness AND liveness,
# both grpc-based, 1s timeout) started timing out ("context deadline
# exceeded") and the pod crash-looped 6 times in 15 minutes, at only ~1
# transaction/second of load -- CPU limit exhaustion causing the
# single-threaded Node.js event loop to stall long enough to miss its own
# health check, not an application bug. This produced ~45-50% transaction
# failure (HTTP 500, "connection refused") in a workload that should have
# had ~0% failure, which is why the pilot's raw success rate is NOT a
# usable M1B baseline as-is.
#
# CPU limit only; memory was not implicated (no MemoryPressure on the
# node, no OOM events observed) and is left unchanged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkoutservice
spec:
  template:
    spec:
      containers:
        - name: server
          resources:
            limits:
              cpu: 500m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: currencyservice
spec:
