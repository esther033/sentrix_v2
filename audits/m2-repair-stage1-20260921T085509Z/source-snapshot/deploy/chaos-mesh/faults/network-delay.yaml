# NetworkChaos delay template -- dependency_edge scope (source service ->
# target service), per sentrix-project-context.md section 7 layer model
# (L3/L4 injection, observed as L7 span latency/timeout).
# {{NAME}}, {{SOURCE_SERVICE}}, {{TARGET_SERVICE}}, {{LATENCY}}, {{JITTER}}, {{DURATION}}
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: "{{NAME}}"
  namespace: sentrix
spec:
  action: delay
  mode: one
  selector:
    namespaces:
      - sentrix
    labelSelectors:
      app: "{{SOURCE_SERVICE}}"
  delay:
    latency: "{{LATENCY}}"
    jitter: "{{JITTER}}"
    correlation: "25"
  direction: to
  target:
    mode: one
    selector:
      namespaces:
        - sentrix
      labelSelectors:
        app: "{{TARGET_SERVICE}}"
  duration: "{{DURATION}}"
