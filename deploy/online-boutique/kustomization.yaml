apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sentrix
resources:
  - manifest-original.yaml
patches:
  - path: otlp-env-patch.yaml
  - path: resource-patch.yaml
  # Online Boutique's built-in Locust-based loadgenerator is disabled --
  # SentriX uses its own k6 workload (workload/k6/browse-cart-checkout.js)
  # so request rate stays under our control and is comparable across runs.
  - target:
      kind: Deployment
      name: loadgenerator
    patch: |
      - op: replace
        path: /spec/replicas
        value: 0
